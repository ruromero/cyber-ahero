name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build win32 + win64
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, as on the Organizer's PC
    steps:
      - uses: actions/checkout@v7

      - name: Cache SDL deps and toolchain
        uses: actions/cache@v6
        with:
          path: |
            deps
            _toolchain
          key: deps-${{ runner.os }}-${{ hashFiles('tools/fetch_deps.ps1', 'tools/get_toolchain.ps1') }}

      - name: Fetch SDL2 deps
        run: tools\fetch_deps.ps1

      - name: Fetch w64devkit toolchain
        run: tools\get_toolchain.ps1

      - name: Build and test x86 (Windows XP, 32-bit)
        run: tools\build.ps1 -Arch x86 -Clean -Tests

      - name: Build and test x64 (64-bit)
        run: tools\build.ps1 -Arch x64 -Clean -Tests

      - name: Check the 32-bit exe only imports DLLs present on XP
        run: |
          $objdump = "_toolchain\w64devkit\bin\objdump.exe"
          $dlls = & $objdump -p build\x86\cyber_ahero.exe | Select-String "DLL Name"
          $dlls | ForEach-Object { $_.Line.Trim() }
          if ($dlls | Where-Object { $_.Line -match "api-ms-win-crt|ucrtbase" }) {
            throw "cyber_ahero.exe (x86) links the UCRT, which Windows XP lacks"
          }

      - name: Pester tests (scrape.ps1 / discovery)
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          $r = Invoke-Pester tools\tests -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester tests failed" }

      - name: Package
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          tools\package.ps1 -Arch x86 -Version $v
          tools\package.ps1 -Arch x64 -Version $v
          tools\package.ps1 -Organizer -Version $v

      - uses: actions/upload-artifact@v7
        with:
          name: cyber-ahero
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cyber-ahero
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
